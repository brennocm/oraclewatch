# oraclewatch example configuration.
#
# Secrets (RPC URLs, webhook URLs, bot tokens) are written as ${VAR} and read from
# the environment; see .env.example. ${VAR} is expanded ONLY in secret fields
# (rpc_endpoints[].url, alerting.discord.webhook_url, alerting.telegram.*,
# self_health.deadman_url). Anywhere else a "${...}" is kept literally.
#
# Unknown keys are errors. Percentages need a "%" sign. Durations use Go syntax
# (90s, 5m, 1h). Validate without network access:
#
#   oraclewatch validate-config --config configs/example.yaml
#
# The networks and feeds below are generated by scripts/gen-example-feeds.py from
# the verified lists in configs/feeds/ (official Chainlink data files, checked
# on-chain; see docs/research.md §4). A test fails if they drift apart.
#
# Polygon is not included in v1: it has no L2 sequencer uptime feed, so the
# sequencer checks do not apply, and v1 focuses on the four networks below.
# Adding it only needs a verified configs/feeds/polygon.yaml and a network block.
#
# Base ETH/USD and BTC/USD are "Shared SVR" feeds (the docs list no plain feed on
# Base). The proxy below is the data file's proxyAddress. If your protocol reads a
# different proxy of the same feed, configure that one: on a DualAggregator the
# answer can depend on which proxy calls it (docs/research.md §1.4).
#
# Per network:
#   l2              true enables the sequencer block and L2 defaults.
#   rpc_endpoints   at least two, from different providers. "name" is what logs
#                   and metrics show; the URL never appears anywhere.
#   poll_interval   detection latency; >= 15s. Default 60s.
#   confirmations   reads happen at min(head of all endpoints) - confirmations,
#                   the same block for every feed and endpoint in a cycle.
#   max_head_lag    FW-CHAIN-001: head older than this means stalled chain or a
#                   lagging RPC. Default 5m (L1), 2m (L2).
#   call_timeout    per RPC call. Default 10s.
#   sequencer       L2 sequencer uptime feed proxy and grace period (default 1h,
#                   the GRACE_PERIOD_TIME of the official example).

networks:
  - name: ethereum
    chain_id: 1
    l2: false
    rpc_endpoints:
      - name: primary
        url: ${ETH_RPC_URL_PRIMARY}
      - name: secondary
        url: ${ETH_RPC_URL_SECONDARY}
    poll_interval: 60s
    confirmations: 2
    explorer_url: https://etherscan.io
  - name: arbitrum
    chain_id: 42161
    l2: true
    rpc_endpoints:
      - name: primary
        url: ${ARB_RPC_URL_PRIMARY}
      - name: secondary
        url: ${ARB_RPC_URL_SECONDARY}
    poll_interval: 60s
    confirmations: 10
    explorer_url: https://arbiscan.io
    sequencer:
      proxy: "0xFdB631F5EE196F0ed6FAa767959853A9F217697D"  # L2 Sequencer Uptime Status Feed
      grace_period: 1h
  - name: base
    chain_id: 8453
    l2: true
    rpc_endpoints:
      - name: primary
        url: ${BASE_RPC_URL_PRIMARY}
      - name: secondary
        url: ${BASE_RPC_URL_SECONDARY}
    poll_interval: 60s
    confirmations: 10
    explorer_url: https://basescan.org
    sequencer:
      proxy: "0xBCF85224fc0756B9Fa45aA7892530B47e10b6433"  # L2 Sequencer Uptime Status Feed
      grace_period: 1h
  - name: optimism
    chain_id: 10
    l2: true
    rpc_endpoints:
      - name: primary
        url: ${OP_RPC_URL_PRIMARY}
      - name: secondary
        url: ${OP_RPC_URL_SECONDARY}
    poll_interval: 60s
    confirmations: 10
    explorer_url: https://optimistic.etherscan.io
    sequencer:
      proxy: "0x371EAD81c9102C9BF4874A9075FFFf170F2Ee389"  # L2 Sequencer Uptime Status Feed
      grace_period: 1h

