# Market reference for FW-DEV-001. USD-quoted markets only: USDT/USDC quotes are
# not USD and diverge most during exactly the events that matter.
reference:
  sources: [coinbase, kraken, bitstamp]   # default; a feed's reference.sources overrides it
  min_sources: 2          # fewer answering -> reference untrusted, FW-REF-001, no FW-DEV-001
  max_source_spread: 1%   # (max-min)/median above this -> untrusted
  timeout: 5s
  max_quote_age: 2m       # quotes older than this (when the exchange reports a time) are dropped
  cache_ttl: 10s

# Check parameters for every feed. A feed can override any of them under its own
# "checks:" key, e.g.  checks: { staleness: { tolerance: 20% } }
defaults:
  checks:
    staleness:            # FW-STALE-001: age > heartbeat + max(heartbeat*tolerance, min_slack)
      enabled: true
      tolerance: 10%
      min_slack: 60s
      critical_factor: 2  # critical when age > critical_factor * max_age
    invalid:              # FW-INVALID-001
      enabled: true
      skew: 60s
    deviation:            # FW-DEV-001: must be >= 2 x the feed's deviation_threshold
      enabled: true
      warn_above: 2%
      critical_above: 5%
    circuit_breaker:      # FW-CB-001: distance of the answer to minAnswer/maxAnswer
      enabled: true
      warn_within: 2%
      critical_within: 0.5%
    jump:                 # FW-JUMP-001 (experimental): round-to-round change
      enabled: false
      max_jump: 20%

cross_chain:              # FW-XCHAIN-001: |a-b|/min(a,b) > thr_a + thr_b + margin
  enabled: true
  margin: 1%

rpc:
  compare_endpoints: true # FW-RPC-001/002: compare every endpoint at the pinned block
  chain_id_recheck: 60    # cycles between eth_chainId checks (FW-RPC-003)
  metadata_refresh: 10    # cycles between decimals/description/aggregator reads

alerting:
  for: 2m                 # a condition must persist this long before it fires
  cooldown: 30m           # no re-send of the same alert before this, unless severity rises
  send_resolved: true
  group_window: 10s       # alerts firing within this window are sent together
  storm_threshold: 5      # more alerts than this in one window -> one summary message
  stdout: true
  discord:
    webhook_url: ${DISCORD_WEBHOOK_URL}
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}

self_health:
  blind_after_cycles: 3   # FW-SELF-001 after this many cycles without a successful read
  deadman_url: ${DEADMAN_URL}   # optional; pinged after each successful cycle

server:
  listen: 127.0.0.1:9090  # /metrics /healthz /readyz /status. Exposing it is the operator's decision.

log:
  level: info
  format: json            # json in production, text for local runs
