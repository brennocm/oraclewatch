# oraclewatch + Prometheus + Grafana behind Caddy (automatic TLS).
#
#   cp .env.example .env   # fill in RPC URLs, notifiers, Grafana password, domain
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
# Networks:
#   monitoring  internal (no internet): prometheus scrapes oraclewatch; grafana queries prometheus
#   egress      oraclewatch only: outbound to RPC providers and exchanges
#   edge        caddy and grafana; caddy is the only service that publishes ports
#
# Images are pinned by digest (multi-arch: amd64 and arm64); Dependabot updates them.

name: oraclewatch

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  oraclewatch:
    <<: *hardening
    image: ${ORACLEWATCH_IMAGE:-ghcr.io/brennocm/oraclewatch:latest}
    build:
      context: ..
    command: ["run", "--config", "/etc/oraclewatch/config.yaml", "--listen", "0.0.0.0:9090"]
    # Only the variables configs/example.yaml references, not the whole .env
    # (which also holds the Grafana admin password). Add any variable your own
    # configuration references.
    environment:
      ETH_RPC_URL_PRIMARY: ${ETH_RPC_URL_PRIMARY}
      ETH_RPC_URL_SECONDARY: ${ETH_RPC_URL_SECONDARY}
      ARB_RPC_URL_PRIMARY: ${ARB_RPC_URL_PRIMARY}
      ARB_RPC_URL_SECONDARY: ${ARB_RPC_URL_SECONDARY}
      BASE_RPC_URL_PRIMARY: ${BASE_RPC_URL_PRIMARY}
      BASE_RPC_URL_SECONDARY: ${BASE_RPC_URL_SECONDARY}
      OP_RPC_URL_PRIMARY: ${OP_RPC_URL_PRIMARY}
      OP_RPC_URL_SECONDARY: ${OP_RPC_URL_SECONDARY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DEADMAN_URL: ${DEADMAN_URL:-}
    volumes:
      - ../configs/example.yaml:/etc/oraclewatch/config.yaml:ro
    networks: [monitoring, egress]
    healthcheck:
      test: ["CMD", "/usr/local/bin/oraclewatch", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]   # never published, never on the edge network
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN in .env}/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      # Optional public read-only view: anonymous users get the Viewer role in
      # the main org, which holds only the provisioned oraclewatch dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oraclewatch.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs: [/tmp]
    networks: [monitoring, edge]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  caddy:
    <<: *hardening
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    cap_add: [NET_BIND_SERVICE]   # bind 80/443
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"      # ACME HTTP-01 challenge and redirect to HTTPS
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

networks:
  monitoring:
    internal: true
  egress: {}
  edge: {}

volumes:
  prometheus-data: {}
  grafana-data: {}
  caddy-data: {}
  caddy-config: {}
