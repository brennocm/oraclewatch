version: "2"

run:
  build-tags:
    - integration
    - fork

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversion: every narrowing conversion is bounds-checked by hand and tested
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: context-as-argument
        - name: unused-parameter
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/brennocm/oraclewatch
